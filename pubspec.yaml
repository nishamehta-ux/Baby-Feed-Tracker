name: baby_feed_tracker
description: Oh baby baby!, a simple baby feeding tracker for breastfeeding and bottle feeding (formula or breast milk).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/ohbaby_app_icon.png
  adaptive_icon_background: "#BCD4E6"
  adaptive_icon_foreground: assets/branding/ohbaby_mark_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  fonts:
    # App text: TeX Gyre Heros, a free font drawn after Helvetica (GUST Font License).
    - family: Heros
      fonts:
        - asset: assets/fonts/TeXGyreHeros-Regular.otf
        - asset: assets/fonts/TeXGyreHeros-Bold.otf
          weight: 700
        - asset: assets/fonts/TeXGyreHeros-Italic.otf
          style: italic
    # The logo wordmark only (SIL Open Font License).
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
